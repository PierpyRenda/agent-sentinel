[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel"
version = "1.0.0"
description = "Security toolkit for Claude Code agents, MCP servers and skills — detect prompt injection, compromised API keys, integrity tampering."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "claude", "mcp", "ai-agent", "prompt-injection", "api-key-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/PierpyRenda/agent-sentinel"
Repository = "https://github.com/PierpyRenda/agent-sentinel"
Issues = "https://github.com/PierpyRenda/agent-sentinel/issues"

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
